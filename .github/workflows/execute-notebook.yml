name: Execute analysis notebook

on:
  push:
    branches: [main]
    paths:
      - "notebooks/Superconductivity_ElasticNet_16_Questions.ipynb"
      - ".github/workflows/execute-notebook.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute notebook and save outputs
        env:
          MPLBACKEND: Agg
        run: |
          jupyter nbconvert             --to notebook             --execute notebooks/Superconductivity_ElasticNet_16_Questions.ipynb             --inplace             --ExecutePreprocessor.timeout=1800             --ExecutePreprocessor.kernel_name=python3

      - name: Commit executed notebook and generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/Superconductivity_ElasticNet_16_Questions.ipynb outputs/figures outputs/reports
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Execute notebook and save analysis outputs"
            git pull --rebase origin main
            git push
          fi
