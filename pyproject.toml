[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superconductivity-elasticnet-regression"
version = "1.2.0"
description = "Superconductivity critical-temperature ML analysis and FastAPI deployment"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
  {name = "Alok Agarwal"}
]
keywords = ["machine-learning", "fastapi", "elasticnet", "superconductivity", "data-science"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.coverage.run]
source = ["app", "src"]
omit = ["notebooks/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
